<style>
  :root{--bg:#0b0f1a;--panel:#141b2b;--line:#26304a;--ink:#e7ecf7;--dim:#8b97b3;--acc:#ffb454;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{position:sticky;top:0;z-index:5;background:rgba(11,15,26,.94);
          backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
  h1{margin:0 0 4px;font-size:16px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  button{font:inherit;background:var(--acc);color:#1a1206;border:0;border-radius:6px;
          padding:7px 14px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
  #count{color:var(--acc);font-weight:700}
  main{padding:16px}
  h2.grp{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
          margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
  h2.grp:first-child{margin-top:4px}
  .cnt{color:var(--acc)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .card{position:relative;display:block;background:var(--panel);border:1px solid var(--line);
         border-radius:8px;padding:10px;cursor:pointer;transition:border-color .12s}
  .card:hover{border-color:var(--acc)}
  .card input{position:absolute;top:8px;left:8px;z-index:2;width:16px;height:16px;accent-color:var(--acc)}
  .card:has(input:checked){border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .thumb{display:block;height:120px;border-radius:6px;
     background:
       linear-gradient(45deg,#2a2a2a 25%,transparent 25%,transparent 75%,#2a2a2a 75%),
       linear-gradient(45deg,#2a2a2a 25%,#1e1e1e 25%,#1e1e1e 75%,#2a2a2a 75%);
     background-size:16px 16px;background-position:0 0,8px 8px;
     display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{max-width:88%;max-height:88%;image-rendering:pixelated;
              transform:scale(1.6)}
  .meta{display:block;margin-top:8px}
  .name{display:block;font-weight:700;font-size:13px}
  .path{display:block;color:var(--dim);font-size:10px;word-break:break-all;margin-top:2px}
  .badge{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:.06em;
          color:#0b1a0f;background:#7ee08a;border-radius:4px;padding:2px 5px;font-weight:700}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
          background:var(--acc);color:#1a1206;padding:8px 16px;border-radius:6px;
          font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
  textarea{position:absolute;left:-9999px}
</style>

<textarea id="sink" readonly></textarea>
<div id="toast">Copied</div>
<script>
  const boxes = () => [...document.querySelectorAll('.pick')];
  const countEl = document.getElementById('count');
  function refresh(){ countEl.textContent = boxes().filter(b=>b.checked).length; }
  document.addEventListener('change', refresh);
  document.getElementById('all').onclick = () => { boxes().forEach(b=>b.checked=true); refresh(); };
  document.getElementById('none').onclick = () => { boxes().forEach(b=>b.checked=false); refresh(); };
  document.getElementById('copy').onclick = () => {
    const paths = boxes().filter(b=>b.checked).map(b=>b.dataset.path);
    if (!paths.length) return;
    const text = paths.join('\n');
    const done = () => {
      const t = document.getElementById('toast');
      t.textContent = 'Copied ' + paths.length + ' path' + (paths.length>1?'s':'');
      t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback(text));
    } else fallback(text);
    function fallback(txt){
      const s = document.getElementById('sink');
      s.value = txt; s.select();
      try { document.execCommand('copy'); done(); } catch(e){ s.style.left='12px'; s.style.bottom='12px'; }
    }
  };
  refresh();
</script>
