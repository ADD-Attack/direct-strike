<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>ReturnToEdenAlpha</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#eden-loader-art {
    position: absolute;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    width: min(160px, 25vmin);
    height: min(160px, 25vmin);
    z-index: 0;
}
#eden-loader-art img {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    pointer-events: none;
}
#eden-loader-motion { display: none; }
#eden-loader-details {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(10% + 2.25rem);
    width: min(50%, 38rem);
    margin: 0 auto;
    color: #fff;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    font-size: clamp(12px, 1.5vw, 16px);
    line-height: 1.35;
    text-align: center;
    text-shadow: 0 1px 3px #000, 0 0 5px #000;
    z-index: 1;
}
#eden-loader-state { font-weight: 700; }
#eden-loader-live {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
@media (max-width: 479px) {
    #eden-loader-art { width: min(96px, 25vmin); height: min(96px, 25vmin); }
}


#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>(function(){window.__edenBuild='';var f=function(v){window.__edenBuild=v};var nf=window.fetch.bind(window),sh=null;window.fetch=function(u,o){if(u==='index.pck'){if(!sh){sh=nf(u);sh.then(function(r){if(!r.ok)sh=null},function(){sh=null})}var p=sh;return p.then(function(r){return r.clone()})}return nf(u,o)};window.fetch('index.pck').then(function(r){if(!r.ok){f('unavailable');return null}return r.arrayBuffer()}).then(function(b){if(!b)return null;var w=(typeof GODOT_CONFIG!=='undefined'&&GODOT_CONFIG.fileSizes)?GODOT_CONFIG.fileSizes['index.pck']:0;if(w&&b.byteLength!==w){f('mismatch');return null}return crypto.subtle.digest('SHA-256',b)}).then(function(d){if(!d)return;var a=new Uint8Array(d),h='';for(var i=0;i<4;i++){h+=('0'+a[i].toString(16)).slice(-2)}f(h)}).catch(function(){f('unavailable')})})();</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="eden-loader-art" aria-hidden="true">
				<img id="eden-loader-poster" src="loader_miner_poster.png" alt="" decoding="async">
				<img id="eden-loader-motion" src="loader_miner.gif" alt="" decoding="async">
			</div>
			<progress id="status-progress" role="progressbar" aria-label="Game download progress" aria-valuemin="0" aria-valuemax="100"></progress>
			<div id="eden-loader-details">
				<div id="eden-loader-state">Progress total unavailable</div>
				<div id="eden-loader-downloaded">Downloaded: 0 B</div>
				<div id="eden-loader-rate">Estimated rate: Calculating…</div>
			</div>
			<div id="eden-loader-live" role="status" aria-live="polite" aria-atomic="true"></div>
			<div id="status-notice"></div>
		</div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":23791728,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const edenLoaderDetails = document.getElementById('eden-loader-details');
	const edenLoaderState = document.getElementById('eden-loader-state');
	const edenLoaderDownloaded = document.getElementById('eden-loader-downloaded');
	const edenLoaderRate = document.getElementById('eden-loader-rate');
	const edenLoaderLive = document.getElementById('eden-loader-live');
	const edenLoaderPoster = document.getElementById('eden-loader-poster');
	const edenLoaderMotion = document.getElementById('eden-loader-motion');
	const edenReducedMotion = window.matchMedia
	    ? window.matchMedia('(prefers-reduced-motion: reduce)')
	    : { matches: false };
	const edenSamples = [];
	let edenLastBytes = null;

	function edenFormatBytes(value) {
	    let amount = Math.max(0, Number.isFinite(value) ? value : 0);
	    if (amount < 1000) return Math.floor(amount) + ' B';
	    const units = ['kB', 'MB', 'GB', 'TB'];
	    let unit = -1;
	    do {
	        amount /= 1000;
	        unit += 1;
	    } while (amount >= 999.95 && unit < units.length - 1);
	    return amount.toFixed(1) + ' ' + units[unit];
	}

	function edenUpdateLoader(current, total) {
	    const now = performance.now();
	    const currentOk = Number.isFinite(current) && current >= 0;
	    const totalOk = Number.isFinite(total) && total > 0;
	    if (currentOk) {
	        const bytes = Math.floor(current);
	        if (edenLastBytes !== null && bytes < edenLastBytes) edenSamples.length = 0;
	        edenLastBytes = bytes;
	        edenSamples.push({ time: now, bytes: bytes });
	        while (edenSamples.length && edenSamples[0].time < now - 2000) edenSamples.shift();
	    }

	    let percent = null;
	    if (currentOk && totalOk) percent = Math.min(99, Math.max(0, Math.floor(100 * current / total)));
	    const state = percent === null
	        ? (totalOk ? 'Progress data unavailable' : 'Progress total unavailable')
	        : percent + '%';
	    let rate = null;
	    if (edenSamples.length >= 2) {
	        const first = edenSamples[0];
	        const last = edenSamples[edenSamples.length - 1];
	        const elapsed = last.time - first.time;
	        if (elapsed > 0 && now - last.time <= 2000) {
	            const measured = (last.bytes - first.bytes) / (elapsed / 1000);
	            if (Number.isFinite(measured) && measured >= 0) rate = measured;
	        }
	    }
	    edenLoaderState.textContent = state;
	    edenLoaderDownloaded.textContent = 'Downloaded: ' + edenFormatBytes(currentOk ? current : 0);
	    edenLoaderRate.textContent = 'Estimated rate: ' + (rate === null ? 'Calculating…' : edenFormatBytes(rate) + '/s');
	    edenLoaderLive.textContent = state + '. ' + edenLoaderDownloaded.textContent + '. ' + edenLoaderRate.textContent;
	}

	function edenSyncRobot() {
	    if (edenReducedMotion.matches) {
	        edenLoaderPoster.style.display = 'block';
	        edenLoaderMotion.style.display = 'none';
	    } else if (edenLoaderMotion.complete && edenLoaderMotion.naturalWidth > 0) {
	        edenLoaderPoster.style.display = 'none';
	        edenLoaderMotion.style.display = 'block';
	    } else {
	        edenLoaderPoster.style.display = 'block';
	        edenLoaderMotion.style.display = 'none';
	    }
	}
	edenLoaderMotion.addEventListener('load', edenSyncRobot);
	edenLoaderMotion.addEventListener('error', function () {
	    edenLoaderPoster.style.display = 'block';
	    edenLoaderMotion.style.display = 'none';
	});
	if (typeof edenReducedMotion.addEventListener === 'function') {
	    edenReducedMotion.addEventListener('change', edenSyncRobot);
	} else if (typeof edenReducedMotion.addListener === 'function') {
	    edenReducedMotion.addListener(edenSyncRobot);
	}
	edenSyncRobot();
	edenUpdateLoader(0, 0);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		edenLoaderDetails.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				edenUpdateLoader(current, total);
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
