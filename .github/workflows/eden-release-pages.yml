name: Deploy Return to Eden Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout hydrated LFS export
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Stage site without repository metadata
        run: |
          mkdir -p "$RUNNER_TEMP/eden-site"
          rsync -a --exclude=.git --exclude=.github ./ "$RUNNER_TEMP/eden-site/"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/eden-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
